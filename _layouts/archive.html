---
layout: default
---

<main id="main-content" class="academic-shell">
  <div class="academic-layout{% unless page.author_profile %} academic-layout--wide{% endunless %}">
    {% include sidebar.html %}

    <section class="academic-page archive" aria-labelledby="page-title">
      <header class="academic-page__header academic-page__header--archive">
        <p class="eyebrow">Academic profile</p>
        <h1 class="page__title" id="page-title">{{ page.title }}</h1>
        {% if page.description %}<p class="academic-page__lead">{{ page.description }}</p>{% endif %}
      </header>
      {{ content }}
    </section>
  </div>
</main>
